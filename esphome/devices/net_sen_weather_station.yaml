substitutions:
  node_name: net-sen-020
  device_name: NET-SEN Weather Station
  setup_ap_password: net-sen-setup
  i2c_sda_pin: GPIO0
  i2c_scl_pin: GPIO1
  rain_pin: GPIO3
  setup_button_pin: GPIO2
  bme280_address: "0x76"
  veml7700_address: "0x10"
  default_sensor_interval: "10"
  temp_offset_c: "0.0"
  hum_offset_pct: "0.0"

esphome:
  name: ${node_name}
  friendly_name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  toolchain: platformio
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${node_name}-setup
    password: ${setup_ap_password}

captive_portal:

web_server:
  port: 81
  version: 3
  local: true

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

globals:
  - id: rain_state
    type: bool
    restore_value: no
    initial_value: "false"

number:
  - platform: template
    id: sensor_interval_number
    name: "${device_name} Sensor Interval"
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 600
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_sensor_interval}
    on_value:
      then:
        - script.execute: apply_sensor_interval

button:
  - platform: restart
    name: "${device_name} Restart"
    entity_category: diagnostic

  - platform: safe_mode
    name: "${device_name} Restart In Safe Mode"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "${device_name} Status"

  - platform: gpio
    id: setup_button
    name: "${device_name} Setup Button"
    entity_category: diagnostic
    pin:
      number: ${setup_button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms

  - platform: gpio
    id: rain_input
    name: "${device_name} Rain"
    device_class: moisture
    pin:
      number: ${rain_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_state:
      then:
        - lambda: 'id(rain_state) = x;'

sensor:
  - platform: bme280_i2c
    id: env_bme280_component
    address: ${bme280_address}
    update_interval: ${default_sensor_interval}s
    temperature:
      name: "${device_name} Temperature"
      device_class: temperature
      state_class: measurement
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      oversampling: 16x
      filters:
        - offset: ${temp_offset_c}
    humidity:
      name: "${device_name} Humidity"
      device_class: humidity
      state_class: measurement
      unit_of_measurement: "%"
      accuracy_decimals: 1
      oversampling: 16x
      filters:
        - offset: ${hum_offset_pct}
        - clamp:
            min_value: 0.0
            max_value: 100.0
    pressure:
      name: "${device_name} Pressure"
      device_class: atmospheric_pressure
      state_class: measurement
      unit_of_measurement: hPa
      accuracy_decimals: 1
      oversampling: 16x

  - platform: veml7700
    id: env_veml7700_sensor
    address: ${veml7700_address}
    update_interval: ${default_sensor_interval}s
    ambient_light:
      name: "${device_name} Illuminance"
      device_class: illuminance
      state_class: measurement
      unit_of_measurement: lx
      accuracy_decimals: 0

  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 60s
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "${device_name} Uptime"
    update_interval: 60s
    unit_of_measurement: s
    state_class: total_increasing
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${device_name} IP Address"
      entity_category: diagnostic
    ssid:
      name: "${device_name} Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "${device_name} Connected BSSID"
      entity_category: diagnostic

script:
  - id: apply_sensor_interval
    then:
      - lambda: |-
          const uint32_t interval_ms = (uint32_t) id(sensor_interval_number).state * 1000UL;
          id(env_bme280_component).set_update_interval(interval_ms);
          id(env_veml7700_sensor).set_update_interval(interval_ms);
