substitutions:
  node_name: net-erl-010
  device_name: NET-ERL Hall Module
  relay_pin: GPIO10
  pir_pin: GPIO7
  i2c_sda_pin: GPIO0
  i2c_scl_pin: GPIO1
  veml7700_address: "0x10"

esphome:
  name: ${node_name}
  friendly_name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

globals:
  - id: auto_light_enabled
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: auto_light_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: lux_threshold_lx
    type: float
    restore_value: yes
    initial_value: "80.0"
  - id: auto_off_delay_s
    type: int
    restore_value: yes
    initial_value: "120"

script:
  - id: auto_off_timer
    mode: restart
    then:
      - delay: !lambda "return (uint32_t) id(auto_off_delay_s) * 1000UL;"
      - if:
          condition:
            lambda: |-
              return id(auto_light_enabled) &&
                     id(auto_light_active) &&
                     !id(hall_motion).state &&
                     id(hall_light).current_values.is_on();
          then:
            - light.turn_off: hall_light
            - lambda: 'id(auto_light_active) = false;'

output:
  - platform: gpio
    id: relay_output
    pin: ${relay_pin}

light:
  - platform: binary
    id: hall_light
    name: "${device_name} Light"
    output: relay_output
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - lambda: 'id(auto_light_active) = false;'

binary_sensor:
  - platform: gpio
    id: hall_motion
    name: "${device_name} Motion"
    device_class: motion
    pin:
      number: ${pir_pin}
    on_press:
      then:
        - script.stop: auto_off_timer
        - if:
            condition:
              lambda: |-
                return id(auto_light_enabled) &&
                       id(env_illuminance).has_state() &&
                       id(env_illuminance).state <= id(lux_threshold_lx) &&
                       !id(hall_light).current_values.is_on();
            then:
              - lambda: 'id(auto_light_active) = true;'
              - light.turn_on: hall_light
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return id(auto_light_enabled) &&
                       id(auto_light_active) &&
                       id(hall_light).current_values.is_on();
            then:
              - script.execute: auto_off_timer

sensor:
  - platform: veml7700
    id: env_veml_sensor
    address: ${veml7700_address}
    update_interval: never
    ambient_light:
      id: env_illuminance
      name: "${device_name} Illuminance"
      device_class: illuminance
      state_class: measurement

interval:
  - interval: 60s
    then:
      - if:
          condition:
            light.is_off: hall_light
          then:
            - component.update: env_veml_sensor

number:
  - platform: template
    id: lux_threshold_number
    name: "${device_name} Lux Threshold"
    entity_category: config
    unit_of_measurement: lx
    device_class: illuminance
    mode: box
    min_value: 0
    max_value: 1000
    step: 1
    lambda: "return id(lux_threshold_lx);"
    set_action:
      - lambda: 'id(lux_threshold_lx) = x;'

  - platform: template
    id: auto_off_delay_number
    name: "${device_name} Auto Off Delay"
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 10
    max_value: 1800
    step: 10
    lambda: "return id(auto_off_delay_s);"
    set_action:
      - lambda: 'id(auto_off_delay_s) = (int) x;'

switch:
  - platform: template
    id: auto_light_switch
    name: "${device_name} Auto Light"
    entity_category: config
    lambda: "return id(auto_light_enabled);"
    turn_on_action:
      - lambda: 'id(auto_light_enabled) = true;'
    turn_off_action:
      - script.stop: auto_off_timer
      - lambda: |-
          id(auto_light_enabled) = false;
          id(auto_light_active) = false;
