substitutions:
  node_name: net-erl-020
  device_name: NET-ERL Hall Module LED Ring
  setup_ap_password: net-erl-setup
  relay_pin: GPIO10
  button_pin: GPIO6
  pir_pin: GPIO7
  i2c_sda_pin: GPIO0
  i2c_scl_pin: GPIO1
  veml7700_address: "0x10"
  led_ring_pin: GPIO4
  led_ring_count: "17"

esphome:
  name: ${node_name}
  friendly_name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${node_name}-setup"
    password: ${setup_ap_password}

captive_portal:

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

globals:
  - id: led_ring_red
    type: float
    restore_value: yes
    initial_value: "1.0"
  - id: led_ring_green
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: led_ring_blue
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: animation_mode_id
    type: int
    restore_value: yes
    initial_value: "1"
  - id: motion_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: motion_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: auto_light_owned
    type: bool
    restore_value: no
    initial_value: "false"

output:
  - platform: gpio
    id: relay_output
    pin: ${relay_pin}

light:
  - platform: binary
    id: hall_light
    name: "Hall Light"
    output: relay_output
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: fastled_clockless
    id: led_ring_light
    internal: true
    pin: ${led_ring_pin}
    num_leds: ${led_ring_count}
    chipset: WS2812B
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

switch:
  - platform: template
    id: auto_light_enabled
    name: "Automatic Light Control"
    icon: mdi:lightbulb-auto
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: sync_relay_state
    turn_off_action:
      - script.execute: sync_relay_state

  - platform: template
    id: led_ring_enabled
    name: "LED Ring Motion Display"
    icon: mdi:led-strip-variant
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: sync_led_ring_state
    turn_off_action:
      - script.execute: sync_led_ring_state

number:
  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness Percent"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 1
    max_value: 100
    step: 1
    mode: slider
    set_action:
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_red_level
    name: "LED Ring Color Red"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 255
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(led_ring_red) = x / 255.0f;
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_green_level
    name: "LED Ring Color Green"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(led_ring_green) = x / 255.0f;
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_blue_level
    name: "LED Ring Color Blue"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(led_ring_blue) = x / 255.0f;
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_display_value
    name: "LED Ring Source Value"
    icon: mdi:gauge
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: -50
    max_value: 150
    step: 0.5
    mode: box
    set_action:
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_scale_min
    name: "LED Ring Scale Minimum"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -50
    max_value: 150
    step: 0.5
    mode: box
    set_action:
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_scale_max
    name: "LED Ring Scale Maximum"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 42.5
    min_value: -50
    max_value: 200
    step: 0.5
    mode: box
    set_action:
      - script.execute: sync_led_ring_state

  - platform: template
    id: led_ring_effect_speed
    name: "LED Ring Animation Speed"
    icon: mdi:speedometer
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 20
    max_value: 300
    step: 5
    mode: slider
    set_action:
      - script.execute: sync_led_ring_state

  - platform: template
    id: motion_hold_seconds
    name: "Motion Hold Time"
    icon: mdi:timer-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 15
    min_value: 0
    max_value: 300
    step: 1
    mode: box
    set_action:
      - script.execute: update_motion_state
      - script.execute: sync_relay_state
      - script.execute: sync_led_ring_state

  - platform: template
    id: auto_on_lux_threshold
    name: "Auto Light Lux Threshold"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 250
    min_value: 0
    max_value: 20000
    step: 1
    mode: box
    set_action:
      - script.execute: sync_relay_state

select:
  - platform: template
    id: led_ring_animation
    name: "LED Ring Animation Mode"
    icon: mdi:animation
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Pulse Bar"
    options:
      - "Static Bar"
      - "Pulse Bar"
      - "Comet Bar"
      - "Scanner Bar"
    set_action:
      - lambda: |-
          if (x == "Static Bar") {
            id(animation_mode_id) = 0;
          } else if (x == "Pulse Bar") {
            id(animation_mode_id) = 1;
          } else if (x == "Comet Bar") {
            id(animation_mode_id) = 2;
          } else {
            id(animation_mode_id) = 3;
          }
      - script.execute: sync_led_ring_state

binary_sensor:
  - platform: status
    name: "Device Status"

  - platform: gpio
    id: pir_raw
    internal: true
    pin:
      number: ${pir_pin}
      mode:
        input: true
    on_state:
      then:
        - script.execute: update_motion_state
        - script.execute: sync_relay_state
        - script.execute: sync_led_ring_state

  - platform: template
    id: hall_motion
    name: "Motion Detected"
    device_class: motion

  - platform: gpio
    id: local_button
    name: "Local Button"
    entity_category: diagnostic
    pin:
      number: ${button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_press:
      then:
        - light.toggle: hall_light

sensor:
  - platform: veml7700
    address: ${veml7700_address}
    update_interval: 10s
    ambient_light:
      id: ambient_lux
      name: "Ambient Illuminance"
      device_class: illuminance
      state_class: measurement
      on_value:
        then:
          - script.execute: sync_relay_state

  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
    entity_category: diagnostic

script:
  - id: update_motion_state
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(pir_raw).state) {
            id(motion_active) = true;
            id(motion_hold_until_ms) = now + (uint32_t) (id(motion_hold_seconds).state * 1000.0f);
          } else if (id(motion_active)) {
            const uint32_t hold_ms = (uint32_t) (id(motion_hold_seconds).state * 1000.0f);
            if (hold_ms == 0) {
              id(motion_active) = false;
              id(motion_hold_until_ms) = 0;
            } else if ((int32_t) (id(motion_hold_until_ms) - now) <= 0) {
              id(motion_active) = false;
              id(motion_hold_until_ms) = 0;
            }
          }
      - binary_sensor.template.publish:
          id: hall_motion
          state: !lambda return id(motion_active);

  - id: sync_led_ring_state
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: led_ring_enabled
              - binary_sensor.is_on: hall_motion
          then:
            - light.turn_on:
                id: led_ring_light
                brightness: 100%
          else:
            - light.turn_off: led_ring_light

  - id: sync_relay_state
    mode: restart
    then:
      - lambda: |-
          const bool auto_enabled = id(auto_light_enabled).state;
          const bool motion = id(hall_motion).state;
          const bool lux_valid = !isnan(id(ambient_lux).state);
          const bool is_dark_enough = lux_valid && id(ambient_lux).state <= id(auto_on_lux_threshold).state;

          if (auto_enabled && motion && is_dark_enough) {
            if (!id(hall_light).current_values.is_on()) {
              id(auto_light_owned) = true;
              auto call = id(hall_light).turn_on();
              call.perform();
            }
            return;
          }

          if (id(auto_light_owned) && id(hall_light).current_values.is_on()) {
            id(auto_light_owned) = false;
            auto call = id(hall_light).turn_off();
            call.perform();
          } else if (!id(hall_light).current_values.is_on()) {
            id(auto_light_owned) = false;
          }

interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(pir_raw).state && id(motion_active) &&
                     (int32_t) (id(motion_hold_until_ms) - millis()) <= 0;
          then:
            - script.execute: update_motion_state
            - script.execute: sync_relay_state
            - script.execute: sync_led_ring_state

  - interval: 100ms
    then:
      - lambda: |-
          auto *output = static_cast<esphome::light::AddressableLight *>(id(led_ring_light).get_output());
          if (output == nullptr) {
            return;
          }

          auto &leds = *output;
          const int led_count = leds.size();
          const bool active = id(led_ring_enabled).state && id(hall_motion).state;

          auto clear_all = [&]() {
            for (int i = 0; i < led_count; i++) {
              leds[i] = esphome::Color(0, 0, 0);
            }
            output->schedule_show();
          };

          if (!active || led_count <= 0) {
            clear_all();
            return;
          }

          float scale_min = id(led_ring_scale_min).state;
          float scale_max = id(led_ring_scale_max).state;
          if (scale_max <= scale_min) {
            scale_max = scale_min + 1.0f;
          }

          float normalized = (id(led_ring_display_value).state - scale_min) / (scale_max - scale_min);
          if (normalized < 0.0f) normalized = 0.0f;
          if (normalized > 1.0f) normalized = 1.0f;

          int lit_leds = (int) lroundf(normalized * led_count);
          if (lit_leds < 0) lit_leds = 0;
          if (lit_leds > led_count) lit_leds = led_count;

          const float base_brightness = id(led_ring_brightness).state / 100.0f;
          const uint32_t now = millis();
          const float speed = id(led_ring_effect_speed).state;

          auto make_color = [&](float factor) -> esphome::Color {
            float brightness = base_brightness * factor;
            if (brightness < 0.0f) brightness = 0.0f;
            if (brightness > 1.0f) brightness = 1.0f;
            return esphome::Color(
              (uint8_t) lroundf(id(led_ring_red) * 255.0f * brightness),
              (uint8_t) lroundf(id(led_ring_green) * 255.0f * brightness),
              (uint8_t) lroundf(id(led_ring_blue) * 255.0f * brightness)
            );
          };

          for (int i = 0; i < led_count; i++) {
            leds[i] = esphome::Color(0, 0, 0);
          }

          if (lit_leds == 0) {
            output->schedule_show();
            return;
          }

          const int animation = id(animation_mode_id);

          if (animation == 0) {
            const esphome::Color c = make_color(1.0f);
            for (int i = 0; i < lit_leds; i++) {
              leds[i] = c;
            }
          } else if (animation == 1) {
            const float pulse = 0.30f + 0.70f * ((sinf((float) now / speed) + 1.0f) * 0.5f);
            const esphome::Color c = make_color(pulse);
            for (int i = 0; i < lit_leds; i++) {
              leds[i] = c;
            }
          } else if (animation == 2) {
            const int head = lit_leds > 0 ? ((int) (now / (uint32_t) speed)) % lit_leds : 0;
            for (int i = 0; i < lit_leds; i++) {
              leds[i] = make_color(0.18f);
            }
            leds[head] = make_color(1.0f);
            if (lit_leds > 1) {
              leds[(head + lit_leds - 1) % lit_leds] = make_color(0.55f);
            }
            if (lit_leds > 2) {
              leds[(head + lit_leds - 2) % lit_leds] = make_color(0.30f);
            }
          } else {
            const int width = lit_leds > 4 ? 4 : lit_leds;
            const int head = lit_leds > 0 ? ((int) (now / (uint32_t) speed)) % lit_leds : 0;
            for (int i = 0; i < lit_leds; i++) {
              int distance = head - i;
              if (distance < 0) distance = -distance;
              if (distance < width) {
                const float factor = 1.0f - (distance / (float) width);
                leds[i] = make_color(0.20f + factor * 0.80f);
              } else {
                leds[i] = make_color(0.12f);
              }
            }
          }

          output->schedule_show();
