substitutions:
  node_name: net-zrl-020
  device_name: NET-ZRL Shutter
  setup_ap_password: net-zrl-setup
  relay_up_pin: GPIO10
  relay_down_pin: GPIO5
  button_up_pin: GPIO20
  button_down_pin: GPIO4
  button_stop_pin: GPIO3
  led_up_pin: GPIO7
  led_down_pin: GPIO6
  default_cover_travel_ms: "60000"

esphome:
  name: ${node_name}
  friendly_name: ${device_name}
  comment: Standard ESPHome shutter with native Home Assistant API
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(cover_state_text) = "stopped";
          id(cover_calibrated) =
            id(cover_travel_up_ms) >= 1000 && id(cover_travel_down_ms) >= 1000;
          if (!id(cover_calibrated)) {
            id(cover_position_percent) = 255;
          }
      - script.execute: publish_cover_state

esp32:
  board: esp32-c3-devkitm-1
  toolchain: platformio
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${node_name}-setup
    password: ${setup_ap_password}

captive_portal:

web_server:

globals:
  - id: stop_button_pressed_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: stop_button_hold_consumed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: down_button_pressed_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: down_button_hold_consumed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: led_blink_phase
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_state_text
    type: std::string
    restore_value: no
    initial_value: '"stopped"'
  - id: cover_position_percent
    type: int
    restore_value: no
    initial_value: "255"
  - id: cover_target_position_percent
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_calibrated
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: cover_travel_up_ms
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: cover_travel_down_ms
    type: uint32_t
    restore_value: yes
    initial_value: "0"
  - id: cover_calib_phase
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_calib_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: cover_calib_temp_up_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: cover_calib_temp_down_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: cover_runtime_direction
    type: int
    restore_value: no
    initial_value: "0"
  - id: cover_movement_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: cover_movement_auto_stop_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: cover_movement_start_position
    type: int
    restore_value: no
    initial_value: "255"
  - id: cover_movement_target_position
    type: int
    restore_value: no
    initial_value: "255"
  - id: cover_movement_targets_end
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_movement_targets_intermediate
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cover_last_relay_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

cover:
  - platform: template
    id: shutter_cover
    name: ${device_name}
    device_class: shutter
    assumed_state: true
    has_position: true
    lambda: |-
      if (id(cover_position_percent) >= 0 && id(cover_position_percent) <= 100) {
        return id(cover_position_percent) / 100.0f;
      }
      return {};
    open_action:
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 0 && id(cover_runtime_direction) == 0;'
          then:
            - script.execute: cover_hw_open
            - script.execute: publish_cover_state
    close_action:
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 0 && id(cover_runtime_direction) == 0;'
          then:
            - script.execute: cover_hw_close
            - script.execute: publish_cover_state
    stop_action:
      - script.execute: stop_cover_action
    position_action:
      - lambda: |-
          if (id(cover_calib_phase) != 0 || id(cover_runtime_direction) != 0) {
            return;
          }

          const int target = (int) (pos * 100.0f + 0.5f);
          if (!id(cover_calibrated) && target > 0 && target < 100) {
            ESP_LOGW("cover", "Ignoring intermediate target %d without calibration", target);
            return;
          }

          id(cover_target_position_percent) = target;

          if (target == 0) {
            id(cover_hw_close).execute();
          } else if (target == 100) {
            id(cover_hw_open).execute();
          } else {
            id(cover_hw_set_position).execute(target);
          }

          id(publish_cover_state).execute();

switch:
  - platform: gpio
    id: cover_relay_up
    pin: ${relay_up_pin}
    restore_mode: ALWAYS_OFF
    interlock: [cover_relay_down]
    interlock_wait_time: 300ms
    internal: true
  - platform: gpio
    id: cover_relay_down
    pin: ${relay_down_pin}
    restore_mode: ALWAYS_OFF
    interlock: [cover_relay_up]
    interlock_wait_time: 300ms
    internal: true
  - platform: gpio
    id: cover_led_up
    pin: ${led_up_pin}
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: cover_led_down
    pin: ${led_down_pin}
    restore_mode: ALWAYS_OFF
    internal: true

number:
  - platform: template
    id: default_cover_travel_time
    name: "${device_name} Default Travel Time"
    entity_category: config
    unit_of_measurement: ms
    min_value: 1000
    max_value: 180000
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: ${default_cover_travel_ms}

  - platform: template
    id: cover_travel_up_number
    name: "${device_name} Travel Up Time"
    entity_category: config
    unit_of_measurement: ms
    min_value: 0
    max_value: 180000
    step: 1
    mode: box
    lambda: |-
      return (float) id(cover_travel_up_ms);
    set_action:
      - lambda: |-
          id(cover_travel_up_ms) = x < 1.0f ? 0 : (uint32_t) x;
          id(cover_calibrated) =
            id(cover_travel_up_ms) >= 1000 && id(cover_travel_down_ms) >= 1000;
          if (!id(cover_calibrated) && id(cover_position_percent) > 0 && id(cover_position_percent) < 100) {
            id(cover_position_percent) = 255;
          }
      - script.execute: publish_cover_state

  - platform: template
    id: cover_travel_down_number
    name: "${device_name} Travel Down Time"
    entity_category: config
    unit_of_measurement: ms
    min_value: 0
    max_value: 180000
    step: 1
    mode: box
    lambda: |-
      return (float) id(cover_travel_down_ms);
    set_action:
      - lambda: |-
          id(cover_travel_down_ms) = x < 1.0f ? 0 : (uint32_t) x;
          id(cover_calibrated) =
            id(cover_travel_up_ms) >= 1000 && id(cover_travel_down_ms) >= 1000;
          if (!id(cover_calibrated) && id(cover_position_percent) > 0 && id(cover_position_percent) < 100) {
            id(cover_position_percent) = 255;
          }
      - script.execute: publish_cover_state

select:
  - platform: template
    id: relay_up_mapping
    name: "${device_name} Relay Up Mapping"
    entity_category: config
    options:
      - relay_a
      - relay_b
    optimistic: true
    restore_value: true
    initial_option: relay_a

button:
  - platform: template
    name: "${device_name} Start Calibration"
    entity_category: config
    on_press:
      - script.execute: start_cover_calibration
      - script.execute: publish_cover_state

  - platform: template
    name: "${device_name} Clear Calibration"
    entity_category: config
    on_press:
      - script.execute: clear_cover_calibration

  - platform: restart
    id: restart_device
    name: "${device_name} Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    id: cover_button_up
    internal: true
    pin:
      number: ${button_up_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(cover_calib_phase) == 4;'
            then:
              - script.execute: start_cover_calibration
              - script.execute: publish_cover_state
            else:
              - if:
                  condition:
                    lambda: 'return id(cover_runtime_direction) == 0 && id(cover_calib_phase) == 0;'
                  then:
                    - script.execute: cover_hw_open
                    - script.execute: publish_cover_state

  - platform: gpio
    id: cover_button_down
    internal: true
    pin:
      number: ${button_down_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(cover_calib_phase) == 2;'
            then:
              - script.execute: start_cover_calibration
              - script.execute: publish_cover_state
            else:
              - lambda: |-
                  id(down_button_pressed_at_ms) = millis();
                  id(down_button_hold_consumed) = false;
              - delay: 5s
              - if:
                  condition:
                    lambda: 'return id(cover_button_down).state && !id(down_button_hold_consumed) && id(cover_runtime_direction) == 0 && id(cover_calib_phase) == 0;'
                  then:
                    - lambda: 'id(down_button_hold_consumed) = true;'
                    - button.press: restart_device
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                const uint32_t pressed_at = id(down_button_pressed_at_ms);
                const uint32_t held_ms = pressed_at > 0 ? millis() - pressed_at : 0;
                const bool hold_consumed = id(down_button_hold_consumed);
                id(down_button_pressed_at_ms) = 0;
                id(down_button_hold_consumed) = false;
                return !hold_consumed && held_ms < 5000UL && id(cover_runtime_direction) == 0 && id(cover_calib_phase) == 0;
            then:
              - script.execute: cover_hw_close
              - script.execute: publish_cover_state

  - platform: gpio
    id: cover_button_stop
    internal: true
    pin:
      number: ${button_stop_pin}
      mode:
        input: true
        pulldown: true
        pullup: false
    filters:
      - delayed_on: 35ms
      - delayed_off: 35ms
    on_press:
      then:
        - lambda: |-
            id(stop_button_pressed_at_ms) = millis();
            id(stop_button_hold_consumed) = false;
        - if:
            condition:
              lambda: 'return id(cover_runtime_direction) != 0 || id(cover_calib_phase) != 0;'
            then:
              - script.execute: stop_cover_action
              - lambda: 'id(stop_button_hold_consumed) = true;'
        - delay: 5s
        - if:
            condition:
              lambda: 'return id(cover_button_stop).state && !id(stop_button_hold_consumed) && id(cover_runtime_direction) == 0 && id(cover_calib_phase) == 0;'
            then:
              - lambda: 'id(stop_button_hold_consumed) = true;'
              - script.execute: start_cover_calibration
              - script.execute: publish_cover_state
    on_release:
      then:
        - lambda: |-
            id(stop_button_pressed_at_ms) = 0;
            id(stop_button_hold_consumed) = false;

text_sensor:
  - platform: template
    name: "${device_name} Status"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (id(cover_calib_phase) != 0) {
        switch (id(cover_calib_phase)) {
          case 1: return {"calibrating_to_top"};
          case 2: return {"calibration_waiting_for_down"};
          case 3: return {"calibrating_down"};
          case 4: return {"calibration_waiting_for_up"};
          case 5: return {"calibrating_up"};
        }
      }
      return {id(cover_state_text)};

  - platform: wifi_info
    ip_address:
      name: "${device_name} IP Address"
      entity_category: diagnostic

script:
  - id: sync_cover_state
    then:
      - lambda: |-
          if (id(cover_runtime_direction) > 0) {
            id(cover_state_text) = "opening";
            return;
          }
          if (id(cover_runtime_direction) < 0) {
            id(cover_state_text) = "closing";
            return;
          }
          if (id(cover_position_percent) == 100) {
            id(cover_state_text) = "open";
            return;
          }
          if (id(cover_position_percent) == 0) {
            id(cover_state_text) = "closed";
            return;
          }
          id(cover_state_text) = "stopped";

  - id: update_led_indicators
    then:
      - lambda: |-
          bool led_up_on = false;
          bool led_down_on = false;

          switch (id(cover_calib_phase)) {
            case 1:
              led_up_on = id(led_blink_phase);
              led_down_on = id(led_blink_phase);
              break;
            case 2:
              led_down_on = id(led_blink_phase);
              break;
            case 3:
              led_down_on = true;
              break;
            case 4:
              led_up_on = id(led_blink_phase);
              break;
            case 5:
              led_up_on = true;
              break;
            default:
              if (id(cover_runtime_direction) > 0) {
                led_up_on = true;
              } else if (id(cover_runtime_direction) < 0) {
                led_down_on = true;
              }
              break;
          }

          if (led_up_on) id(cover_led_up).turn_on();
          else id(cover_led_up).turn_off();

          if (led_down_on) id(cover_led_down).turn_on();
          else id(cover_led_down).turn_off();

  - id: publish_cover_state
    then:
      - script.execute: sync_cover_state
      - script.execute: update_led_indicators
      - lambda: |-
          if (id(cover_position_percent) >= 0 && id(cover_position_percent) <= 100) {
            id(shutter_cover).position = id(cover_position_percent) / 100.0f;
          }

          if (id(cover_runtime_direction) > 0) {
            id(shutter_cover).current_operation = COVER_OPERATION_OPENING;
          } else if (id(cover_runtime_direction) < 0) {
            id(shutter_cover).current_operation = COVER_OPERATION_CLOSING;
          } else {
            id(shutter_cover).current_operation = COVER_OPERATION_IDLE;
          }

          id(shutter_cover).publish_state();

  - id: blink_calibration_success
    then:
      - repeat:
          count: 3
          then:
            - switch.turn_on: cover_led_up
            - switch.turn_on: cover_led_down
            - delay: 250ms
            - switch.turn_off: cover_led_up
            - switch.turn_off: cover_led_down
            - delay: 250ms

  - id: start_cover_calibration
    then:
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 0 && id(cover_runtime_direction) == 0;'
          then:
            - lambda: |-
                id(cover_calib_phase) = 1;
                id(cover_calib_temp_up_ms) = 0;
                id(cover_calib_temp_down_ms) = 0;
                id(cover_calib_start_ms) = millis();
            - script.execute: cover_hw_open
            - script.execute: publish_cover_state
            - script.stop: start_cover_calibration
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 2 && id(cover_runtime_direction) == 0;'
          then:
            - lambda: |-
                id(cover_calib_phase) = 3;
                id(cover_calib_start_ms) = millis();
            - script.execute: cover_hw_close
            - script.execute: publish_cover_state
            - script.stop: start_cover_calibration
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) == 4 && id(cover_runtime_direction) == 0;'
          then:
            - lambda: |-
                id(cover_calib_phase) = 5;
                id(cover_calib_start_ms) = millis();
            - script.execute: cover_hw_open
            - script.execute: publish_cover_state

  - id: finish_cover_calibration
    then:
      - lambda: |-
          if (id(cover_calib_temp_up_ms) < 2000 || id(cover_calib_temp_down_ms) < 2000) {
            id(cover_calib_phase) = 0;
            return;
          }

          id(cover_travel_up_ms) = id(cover_calib_temp_up_ms);
          id(cover_travel_down_ms) = id(cover_calib_temp_down_ms);
          id(cover_calibrated) = true;
          id(cover_position_percent) = 100;
          id(cover_calib_phase) = 0;
      - script.execute: publish_cover_state
      - script.execute: blink_calibration_success
      - script.execute: publish_cover_state

  - id: clear_cover_calibration
    then:
      - lambda: |-
          id(cover_calibrated) = false;
          id(cover_travel_up_ms) = 0;
          id(cover_travel_down_ms) = 0;
          if (id(cover_position_percent) > 0 && id(cover_position_percent) < 100) {
            id(cover_position_percent) = 255;
          }
          id(cover_calib_phase) = 0;
          id(cover_calib_temp_up_ms) = 0;
          id(cover_calib_temp_down_ms) = 0;
      - script.execute: publish_cover_state

  - id: handle_calib_stop
    then:
      - lambda: |-
          if (id(cover_calib_phase) == 3) {
            const uint32_t elapsed = millis() - id(cover_calib_start_ms);
            if (elapsed >= 2000UL && elapsed <= 180000UL) {
              id(cover_calib_temp_down_ms) = elapsed;
              id(cover_calib_phase) = 4;
            } else {
              id(cover_calib_phase) = 0;
            }
            return;
          }

          if (id(cover_calib_phase) == 5) {
            const uint32_t elapsed = millis() - id(cover_calib_start_ms);
            if (elapsed >= 2000UL && elapsed <= 180000UL) {
              id(cover_calib_temp_up_ms) = elapsed;
              id(finish_cover_calibration).execute();
            } else {
              id(cover_calib_phase) = 0;
            }
          }

  - id: stop_cover_action
    then:
      - if:
          condition:
            lambda: 'return id(cover_runtime_direction) != 0;'
          then:
            - script.execute: cover_hw_stop
            - if:
                condition:
                  lambda: 'return id(cover_calib_phase) == 3 || id(cover_calib_phase) == 5;'
                then:
                  - script.execute: handle_calib_stop
            - script.execute: publish_cover_state
            - script.stop: stop_cover_action
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) != 0;'
          then:
            - lambda: |-
                id(cover_calib_phase) = 0;
                id(cover_calib_temp_up_ms) = 0;
                id(cover_calib_temp_down_ms) = 0;
            - script.execute: publish_cover_state

  - id: cover_hw_start_direction
    parameters:
      direction: int
      auto_stop_ms: int
      targets_end: bool
      targets_intermediate: bool
      target_position: int
    then:
      - lambda: |-
          if (direction == 0 || id(cover_runtime_direction) != 0) {
            return;
          }

          const uint32_t now = millis();
          if (id(cover_last_relay_change_ms) > 0 && now - id(cover_last_relay_change_ms) < 300UL) {
            delay(300UL - (now - id(cover_last_relay_change_ms)));
          }

          id(cover_relay_up).turn_off();
          id(cover_relay_down).turn_off();

          id(cover_runtime_direction) = direction > 0 ? 1 : -1;
          id(cover_movement_started_ms) = millis();
          id(cover_movement_auto_stop_ms) = auto_stop_ms > 0 ? (uint32_t) auto_stop_ms : 0UL;
          id(cover_movement_start_position) =
            id(cover_position_percent) >= 0 && id(cover_position_percent) <= 100
              ? id(cover_position_percent)
              : 0;
          id(cover_movement_targets_end) = targets_end;
          id(cover_movement_targets_intermediate) = targets_intermediate;
          id(cover_movement_target_position) = target_position;
          id(cover_state_text) = direction > 0 ? "opening" : "closing";

          const bool up_uses_relay_b = id(relay_up_mapping).current_option() == "relay_b";
          const bool use_second_relay = direction > 0 ? up_uses_relay_b : !up_uses_relay_b;
          if (use_second_relay) {
            id(cover_relay_down).turn_on();
          } else {
            id(cover_relay_up).turn_on();
          }
          id(cover_last_relay_change_ms) = millis();

  - id: cover_hw_open
    then:
      - lambda: |-
          int auto_stop_ms = 0;
          bool targets_end = false;

          if (id(cover_calib_phase) == 1) {
            auto_stop_ms = (int) id(default_cover_travel_time).state;
            targets_end = true;
          } else if (id(cover_calib_phase) == 5) {
            auto_stop_ms = 180000;
            targets_end = true;
          } else if (id(cover_calibrated) && id(cover_travel_up_ms) >= 1000) {
            auto_stop_ms = (id(cover_travel_up_ms) * 12) / 10;
            targets_end = true;
          } else {
            auto_stop_ms = (int) id(default_cover_travel_time).state;
            targets_end = auto_stop_ms > 0;
          }

          id(cover_hw_start_direction).execute(1, auto_stop_ms, targets_end, false, 100);

  - id: cover_hw_close
    then:
      - lambda: |-
          int auto_stop_ms = 0;
          bool targets_end = false;

          if (id(cover_calib_phase) == 3) {
            auto_stop_ms = 180000;
            targets_end = true;
          } else if (id(cover_calibrated) && id(cover_travel_down_ms) >= 1000) {
            auto_stop_ms = (id(cover_travel_down_ms) * 12) / 10;
            targets_end = true;
          } else {
            auto_stop_ms = (int) id(default_cover_travel_time).state;
            targets_end = auto_stop_ms > 0;
          }

          id(cover_hw_start_direction).execute(-1, auto_stop_ms, targets_end, false, 0);

  - id: cover_hw_stop
    then:
      - lambda: |-
          if (id(cover_runtime_direction) != 0 && id(cover_calibrated)) {
            const uint32_t travel_ms =
              id(cover_runtime_direction) > 0 ? id(cover_travel_up_ms) : id(cover_travel_down_ms);
            if (travel_ms >= 1000) {
              const uint32_t elapsed = millis() - id(cover_movement_started_ms);
              int delta = (int) ((elapsed * 100UL) / travel_ms);
              int next = id(cover_movement_start_position);
              next += id(cover_runtime_direction) > 0 ? delta : -delta;
              if (next < 0) next = 0;
              if (next > 100) next = 100;
              id(cover_position_percent) = next;
            }
          }

          if (id(cover_movement_targets_intermediate) && id(cover_calibrated)) {
            id(cover_position_percent) = id(cover_movement_target_position);
          }
          if (id(cover_movement_targets_end)) {
            id(cover_position_percent) = id(cover_runtime_direction) > 0 ? 100 : 0;
          }

          id(cover_relay_up).turn_off();
          id(cover_relay_down).turn_off();
          id(cover_last_relay_change_ms) = millis();
          id(cover_runtime_direction) = 0;
          id(cover_movement_started_ms) = 0;
          id(cover_movement_auto_stop_ms) = 0;
          id(cover_movement_start_position) = id(cover_position_percent);
          id(cover_movement_target_position) = id(cover_position_percent);
          id(cover_movement_targets_end) = false;
          id(cover_movement_targets_intermediate) = false;
          id(cover_state_text) = "stopped";

  - id: cover_hw_set_position
    parameters:
      target_position: int
    then:
      - lambda: |-
          if (!id(cover_calibrated) || id(cover_position_percent) < 0 || id(cover_position_percent) > 100) {
            ESP_LOGW("cover", "set_position ignored: not calibrated");
            return;
          }

          const int current = id(cover_position_percent);
          if (current == target_position) {
            return;
          }

          const int delta_abs =
            target_position > current ? target_position - current : current - target_position;
          const uint32_t travel_ms =
            target_position > current ? id(cover_travel_up_ms) : id(cover_travel_down_ms);

          int partial_ms = (int) ((travel_ms * (uint32_t) delta_abs) / 100UL);
          if (partial_ms < 1) {
            partial_ms = 1;
          }

          const int direction = target_position > current ? 1 : -1;
          id(cover_hw_start_direction).execute(direction, partial_ms, false, true, target_position);

interval:
  - interval: 350ms
    then:
      - lambda: |-
          id(led_blink_phase) = !id(led_blink_phase);
      - if:
          condition:
            lambda: 'return id(cover_calib_phase) != 0;'
          then:
            - script.execute: update_led_indicators

  - interval: 100ms
    then:
      - lambda: |-
          if (id(cover_runtime_direction) == 0) {
            return;
          }

          if (id(cover_calibrated)) {
            const uint32_t travel_ms =
              id(cover_runtime_direction) > 0 ? id(cover_travel_up_ms) : id(cover_travel_down_ms);
            if (travel_ms >= 1000) {
              const uint32_t elapsed = millis() - id(cover_movement_started_ms);
              int delta = (int) ((elapsed * 100UL) / travel_ms);
              int next = id(cover_movement_start_position);
              next += id(cover_runtime_direction) > 0 ? delta : -delta;
              if (next < 0) next = 0;
              if (next > 100) next = 100;
              id(cover_position_percent) = next;
            }
          }

          if (id(cover_movement_auto_stop_ms) == 0) {
            return;
          }
          if (millis() - id(cover_movement_started_ms) < id(cover_movement_auto_stop_ms)) {
            return;
          }

          if (id(cover_calib_phase) == 1) {
            id(cover_hw_stop).execute();
            id(cover_calib_phase) = 2;
            id(publish_cover_state).execute();
            return;
          }

          if (id(cover_calib_phase) == 3 || id(cover_calib_phase) == 5) {
            id(cover_hw_stop).execute();
            id(cover_calib_phase) = 0;
            id(cover_calib_temp_up_ms) = 0;
            id(cover_calib_temp_down_ms) = 0;
            id(publish_cover_state).execute();
            return;
          }

          id(cover_hw_stop).execute();
          id(publish_cover_state).execute();

  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(cover_runtime_direction) != 0 || id(cover_calib_phase) != 0;'
          then:
            - script.execute: publish_cover_state
